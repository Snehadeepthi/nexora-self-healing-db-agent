# Generated by split_toolbox_config.py from tools.yaml -- do not hand-edit
# without re-running the split, or the two files will drift.
#
# Config for the second Toolbox instance (mcp_toolbox_cloudrun.tf),
# dedicated to AlloyDB + MySQL so an Oracle VM outage can no longer
# blind their telemetry too (see apply_toolbox_split_code.py). ${VAR}
# placeholders below still need literal values resolved before this
# goes into Secret Manager -- see README_TOOLBOX_SPLIT.md step 3.
kind: source
name: alloydb-db
type: postgres
host: ${ALLOYDB_HOST}
port: ${ALLOYDB_PORT}
database: ${ALLOYDB_DATABASE}
user: ${ALLOYDB_USER}
