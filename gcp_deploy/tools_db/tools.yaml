# MCP Toolbox for Databases -- tool definitions for the self-healing agent.
#
# This file is the single source of truth for every SQL statement the agent
# can ever run against Oracle. It is a direct, 1:1 translation of
# config.ALLOWLIST (see ../config.py, copied unchanged from the original
# reference implementation) into Toolbox's tool format -- same action names,
# same tiers (documented in each tool's description so the model sees them),
# same statement templates, same param schemas. config.py stays the single
# source of truth for TIERING and SIGNOFF enforcement (that happens in
# ../guardrail_callbacks.py, in our own process, not in Toolbox); this file
# is only responsible for *how the SQL actually runs*.
#
# One deliberate omission: restart_listener. It's an OS-level `lsnrctl
# restart`, not SQL -- Toolbox is a SQL/database tool server and has no path
# to a host shell. It stays a local ADK FunctionTool in ../db_tools.py that
# fails loudly with the same honest error the reference GCP deployment's
# oracle_client.py already documents, rather than being faked here.
#
# ALTER SYSTEM statements don't accept Oracle bind variables the way normal
# DML does, so the dynamic values below use Toolbox's `templateParameters`
# (textual substitution into the statement, Go-template `{{.name}}` syntax)
# rather than `parameters` (driver-bound placeholders) -- the same reason
# the original reference implementation builds these with Python `.format()`
# instead of a parameterized driver call. See act.py's docstring for the
# same tradeoff stated in the original codebase.

kind: source
name: oracle-db
type: oracle
host: ${ORACLE_HOST}
port: ${ORACLE_PORT}
serviceName: ${ORACLE_SERVICE}
user: ${ORACLE_USER}
password: ${ORACLE_PASSWORD}

---
# --- Read tools (Sense stage -- called directly via toolbox-core, no LLM) ---

kind: tool
name: poll_telemetry
type: oracle-sql
source: oracle-db
readOnly: true
description: >
  Sense-stage poll: current count of sessions blocked by another session's
  lock, and the latest host CPU utilization reading. No parameters.
statement: |
  SELECT
    (SELECT COUNT(*) FROM v$session WHERE blocking_session IS NOT NULL) AS active_blocked_sessions,
    (SELECT NVL(ROUND(value), 0) FROM v$sysmetric
      WHERE metric_name = 'Host CPU Utilization (%)'
      ORDER BY begin_time DESC FETCH FIRST 1 ROW ONLY) AS cpu_utilization_pct
  FROM dual

---
kind: tool
name: describe_state
type: oracle-sql
source: oracle-db
readOnly: true
description: >
  Act-stage pre-action snapshot: same blocked-session count as
  poll_telemetry, taken immediately before a remediation statement runs, so
  every action_executed audit entry carries a pre-state snapshot (Risk 1:
  wrong-diagnosis blast radius).
statement: |
  SELECT COUNT(*) AS active_blocked_sessions_snapshot FROM v$session
  WHERE blocking_session IS NOT NULL

---
kind: tool
name: describe_database
type: oracle-sql
source: oracle-db
readOnly: true
description: >
  Dashboard-only info lookup: the real instance name, current container
  (PDB) name, and Oracle version banner -- not hardcoded in the dashboard,
  so it reflects whatever's actually running. Needs V_$INSTANCE/V_$VERSION
  grants (see database.tf's grant_v_views.sql). No parameters.
statement: |
  SELECT
    (SELECT instance_name FROM v$instance) AS db_name,
    sys_context('userenv','con_name') AS pdb_name,
    (SELECT version FROM v$instance) AS version_short,
    (SELECT banner FROM v$version WHERE banner LIKE '%Database%' FETCH FIRST 1 ROW ONLY) AS version_banner
  FROM dual

---
kind: tool
name: statspack_window
type: oracle-sql
source: oracle-db
readOnly: true
description: >
  Statspack dashboard panel: the two most recent Statspack snapshot IDs
  (perfstat.stats$snapshot), used as the window for statspack_summary and
  statspack_top_waits. No parameters.
statement: |
  SELECT
    MIN(snap_id) AS begin_snap,
    MAX(snap_id) AS end_snap
  FROM (
    SELECT snap_id FROM perfstat.stats$snapshot
    ORDER BY snap_id DESC FETCH FIRST 2 ROWS ONLY
  )

---
kind: tool
name: statspack_summary
type: oracle-sql
source: oracle-db
readOnly: true
description: >
  Statspack dashboard panel: core instance-efficiency ratios (buffer cache
  hit %, library cache hit %) and load-profile rates (redo/sec, logical
  reads/sec, physical reads/sec, executes/sec) computed as the delta
  between two Statspack snapshots. Query verified manually against live
  snap 11->12 data (Buffer Cache Hit 99.9%, Library Cache Hit 96.3%, Redo
  3.19 KB/s, Logical Reads 15.9/s, Physical Reads 0.02/s, Executes 2.47/s)
  before being wired in here.
parameters:
  - name: begin_snap
    type: integer
    description: The earlier Statspack snap_id (perfstat.stats$snapshot).
  - name: end_snap
    type: integer
    description: The later Statspack snap_id (perfstat.stats$snapshot).
statement: |
  WITH deltas AS (
    SELECT e.name, e.value - b.value AS delta
    FROM perfstat.stats$sysstat b
    JOIN perfstat.stats$sysstat e ON e.name = b.name
    WHERE b.snap_id = :begin_snap AND e.snap_id = :end_snap
  ),
  elapsed AS (
    SELECT (e.snap_time - b.snap_time) * 86400 AS secs
    FROM perfstat.stats$snapshot b, perfstat.stats$snapshot e
    WHERE b.snap_id = :begin_snap AND e.snap_id = :end_snap
  ),
  agg AS (
    SELECT
      MAX(CASE WHEN name = 'physical reads' THEN delta END) AS phys_reads,
      MAX(CASE WHEN name = 'db block gets' THEN delta END) AS db_block_gets,
      MAX(CASE WHEN name = 'consistent gets' THEN delta END) AS consistent_gets,
      MAX(CASE WHEN name = 'redo size' THEN delta END) AS redo_size,
      MAX(CASE WHEN name = 'execute count' THEN delta END) AS execute_count
    FROM deltas
  ),
  lib AS (
    SELECT ROUND(SUM(e.pinhits - b.pinhits) / NULLIF(SUM(e.pins - b.pins), 0) * 100, 2) AS library_cache_hit_pct
    FROM perfstat.stats$librarycache b, perfstat.stats$librarycache e
    WHERE b.snap_id = :begin_snap AND e.snap_id = :end_snap
      AND b.namespace = e.namespace
  )
  SELECT
    ROUND((1 - agg.phys_reads / NULLIF(agg.db_block_gets + agg.consistent_gets, 0)) * 100, 2) AS buffer_cache_hit_pct,
    lib.library_cache_hit_pct AS library_cache_hit_pct,
    ROUND(agg.redo_size / NULLIF(elapsed.secs, 0) / 1024, 2) AS redo_per_sec_kb,
    ROUND((agg.db_block_gets + agg.consistent_gets) / NULLIF(elapsed.secs, 0), 1) AS logical_reads_per_sec,
    ROUND(agg.phys_reads / NULLIF(elapsed.secs, 0), 2) AS physical_reads_per_sec,
    ROUND(agg.execute_count / NULLIF(elapsed.secs, 0), 2) AS executes_per_sec,
    ROUND(elapsed.secs / 60, 1) AS elapsed_minutes
  FROM agg, elapsed, lib

---
kind: tool
name: statspack_top_waits
type: oracle-sql
source: oracle-db
readOnly: true
description: >
  Statspack dashboard panel: top 5 wait events by time waited between two
  Statspack snapshots, excluding common idle events.
parameters:
  - name: begin_snap
    type: integer
    description: The earlier Statspack snap_id (perfstat.stats$snapshot).
  - name: end_snap
    type: integer
    description: The later Statspack snap_id (perfstat.stats$snapshot).
statement: |
  SELECT
    e.event AS event,
    e.total_waits - b.total_waits AS waits,
    ROUND((e.time_waited_micro - b.time_waited_micro) / 1000000, 1) AS time_waited_sec
  FROM perfstat.stats$system_event b, perfstat.stats$system_event e
  WHERE b.snap_id = :begin_snap AND e.snap_id = :end_snap
    AND b.event = e.event
    AND e.event NOT IN (
      'SQL*Net message from client','rdbms ipc message','smon timer','pmon timer',
      'jobq slave wait','class slave wait','PL/SQL lock timer',
      'wait for unread message on broadcast channel'
    )
    AND (e.time_waited_micro - b.time_waited_micro) > 0
  ORDER BY (e.time_waited_micro - b.time_waited_micro) DESC
  FETCH FIRST 5 ROWS ONLY

---
kind: tool
name: find_blocking_session
type: oracle-sql
source: oracle-db
readOnly: true
description: >
  Sense/Reason-stage lookup: the real SID and SERIAL# of the session
  currently HOLDING a blocking lock (not the sessions waiting on it) --
  grounds kill_blocking_session's required params in a real fact instead of
  leaving the model to guess them, which would either fail loudly
  (ORA-00030 on a made-up sid) or, worse, risk hitting an unrelated real
  session that happens to share a guessed sid. No parameters.
statement: |
  SELECT
    bs.sid AS blocking_sid,
    bs.serial# AS blocking_serial
  FROM v$session bs
  WHERE bs.sid = (
    SELECT blocking_session FROM v$session
    WHERE blocking_session IS NOT NULL
    FETCH FIRST 1 ROW ONLY
  )

---
# --- Remediation tools (Reason+Act stage -- LLM-callable, one per
#     config.ALLOWLIST entry, guarded by guardrail_callbacks.py) ---

kind: tool
name: kill_blocking_session
type: oracle-sql
source: oracle-db
description: >
  Tier 1 (auto-executes). Terminate a single session holding a blocking
  lock. Use when active_blocked_sessions is sustained_high and the nearest
  runbook points at lock contention.
templateParameters:
  - name: sid
    type: integer
    description: The blocking session's SID (v$session.sid).
  - name: serial
    type: integer
    description: The blocking session's SERIAL# (v$session.serial#), paired with sid.
statement: |
  ALTER SYSTEM KILL SESSION '{{.sid}},{{.serial}}' IMMEDIATE

---
kind: tool
name: kill_runaway_query
type: oracle-sql
source: oracle-db
description: >
  Tier 1 (auto-executes). Terminate a single runaway/long-running query
  session. Same mechanism as kill_blocking_session, kept as a distinct
  allowlisted action so the audit trail records the operator's actual
  diagnosis (lock contention vs. a runaway query), not just the SQL that ran.
templateParameters:
  - name: sid
    type: integer
    description: The runaway session's SID (v$session.sid).
  - name: serial
    type: integer
    description: The runaway session's SERIAL# (v$session.serial#), paired with sid.
statement: |
  ALTER SYSTEM KILL SESSION '{{.sid}},{{.serial}}' IMMEDIATE

---
kind: tool
name: flush_shared_pool
type: oracle-sql
source: oracle-db
description: >
  Tier 2 (auto-executes, logged loudly + paged). Flush the shared pool to
  relieve library cache contention. No parameters.
statement: |
  ALTER SYSTEM FLUSH SHARED_POOL

---
kind: tool
name: increase_pga_target
type: oracle-sql
source: oracle-db
description: >
  Tier 3 (requires human approval -- instance-wide change). Raise
  PGA_AGGREGATE_TARGET by one step to relieve memory pressure.
templateParameters:
  - name: target_mb
    type: integer
    description: New PGA_AGGREGATE_TARGET value, in megabytes.
statement: |
  ALTER SYSTEM SET PGA_AGGREGATE_TARGET = {{.target_mb}}M SCOPE=BOTH

---
kind: toolset
name: db_reads
tools:
  - poll_telemetry
  - describe_state
  - find_blocking_session
  - describe_database
  - statspack_window
  - statspack_summary
  - statspack_top_waits

---
kind: toolset
name: db_remediation
tools:
  - kill_blocking_session
  - kill_runaway_query
  - flush_shared_pool
  - increase_pga_target

---
kind: toolset
name: db_ops
tools:
  - poll_telemetry
  - describe_state
  - find_blocking_session
  - describe_database
  - statspack_window
  - statspack_summary
  - statspack_top_waits
  - kill_blocking_session
  - kill_runaway_query
  - flush_shared_pool
  - increase_pga_target
